<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#147d64"><title>路由与报警</title><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/workspace.css"></head><body>
<header><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 15h4l3-8 4 12 3-8h4"/></svg></div><div><strong>路由与报警</strong><small id="connection-label">连接你的设备</small></div><button id="connections" aria-label="管理连接">＋</button></header>
<main id="content" aria-live="polite"></main>
<nav aria-label="主导航"><button data-tab="router" class="active"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 15h4l3-8 4 12 3-8h4"/></svg></span>路由器</button><button data-tab="alarm"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20h4"/></svg></span>报警</button><button data-tab="history"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span>历史</button><button data-tab="settings"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 15 6-6M8 13l-2 2a3 3 0 0 0 4 4l3-3M11 8l3-3a3 3 0 0 1 4 4l-2 2"/></svg></span>连接</button></nav>
<dialog id="dialog"><form id="dialog-form"><div id="dialog-body"></div><div class="dialog-actions"><button type="button" id="close-dialog">取消</button><button type="submit" class="primary">确定</button></div></form></dialog>
<div id="toast" role="status"></div><script type="module" src="/src/main.js"></script></body></html>
