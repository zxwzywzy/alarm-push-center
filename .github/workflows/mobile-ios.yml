name: Build unsigned iPhone app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build unsigned IPA
        run: sh mobile/scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AlarmHub-iPhone-unsigned
          path: |
            mobile/ios/App/Unsigned/AlarmHub-*-unsigned.ipa
            mobile/ios/App/Unsigned/AlarmHub-*-unsigned.ipa.sha256
          if-no-files-found: error
